name: Deploy to Helm repo
description: Pin image.tag in the client's GitLab deploy repo, in a file only CI writes.

inputs:
  deploy-repo:
    description: "GitLab path of the client's deploy repo, e.g. ordomatics/clients/acme"
    required: true
  file-suffix:
    description: >-
      Which deployment's files to touch, e.g. test / staging / prod — the same
      suffix the platform names values.<suffix>.yaml by.
    required: true
  image-tag:
    description: "Image tag to set, e.g. test-abc1234"
    required: true
  commit-message:
    description: "Git commit message"
    required: true
  deploy-ssh-key:
    description: "SSH private key for a GitLab deploy key with push access to the deploy repo"
    required: true

runs:
  using: composite
  steps:
    - name: Install yq
      shell: bash
      run: |
        sudo wget -qO /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v4.44.2/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

    - name: Set up deploy key
      shell: bash
      env:
        DEPLOY_SSH_KEY: ${{ inputs.deploy-ssh-key }}
      run: |
        mkdir -p ~/.ssh
        echo "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/deploy_key
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

    - name: Update Helm values and push
      shell: bash
      env:
        DEPLOY_REPO: ${{ inputs.deploy-repo }}
        FILE_SUFFIX: ${{ inputs.file-suffix }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        git clone "git@gitlab.com:${DEPLOY_REPO}.git" deploy-repo
        cd deploy-repo

        # This file is the published pointer for the channel -- "the tested
        # artifact for <suffix> is X" -- not a statement that anything is
        # running it. So it is written whether or not a deployment exists: one
        # created later then starts on the current tag instead of the chart's
        # default. Never values.<suffix>.yaml, which deploy-branch regenerates
        # whole, reverting any tag written there (live 2026-09-12).
        IMAGE_FILE="image.${FILE_SUFFIX}.yaml"
        if [ ! -f "${IMAGE_FILE}" ]; then
          printf '# Written by the client CI on every promote: the tested artifact for\n# this channel. Not generated by deploy-branch, so a redeploy cannot\n# revert it.\nimage:\n  tag: ""\n' > "${IMAGE_FILE}"
        fi
        yq e ".image.tag = \"${IMAGE_TAG}\"" -i "${IMAGE_FILE}"

        # Publishing succeeded either way; say plainly whether anything is
        # consuming it. Claiming a deployment that does not exist is what kept
        # smartacus's absent test deployment invisible (2026-09-12).
        if [ -f "application.${FILE_SUFFIX}.yaml" ]; then
          echo "DEPLOYED=true" >> "$GITHUB_ENV"
        else
          echo "DEPLOYED=false" >> "$GITHUB_ENV"
          echo "::notice::${FILE_SUFFIX} now points at ${IMAGE_TAG}, but no ${FILE_SUFFIX} deployment exists in ${DEPLOY_REPO} — nothing is running it yet."
        fi

        git config user.email "ci@ordomatics.com"
        git config user.name "GitHub CI"
        git add "${IMAGE_FILE}"
        if git diff --cached --quiet; then
          echo "No changes — already at ${IMAGE_TAG}"
          exit 0
        fi
        git commit -m "${COMMIT_MESSAGE}"
        git push || (git pull --rebase && git push)
