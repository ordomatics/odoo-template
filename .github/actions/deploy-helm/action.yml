name: Deploy to Helm repo
description: Update image.tag in a Helm values file and push to the client's own GitLab deploy repo.

inputs:
  deploy-repo:
    description: "GitLab path of the client's deploy repo, e.g. ordomatics/clients/acme"
    required: true
  values-file:
    description: "Relative path within the deploy repo, e.g. values.test.yaml"
    required: true
  image-tag:
    description: "Image tag to set, e.g. test-abc1234"
    required: true
  commit-message:
    description: "Git commit message"
    required: true
  deploy-ssh-key:
    description: "SSH private key for a GitLab deploy key with push access to the deploy repo"
    required: true

runs:
  using: composite
  steps:
    - name: Install yq
      shell: bash
      run: |
        sudo wget -qO /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v4.44.2/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

    - name: Set up deploy key
      shell: bash
      env:
        DEPLOY_SSH_KEY: ${{ inputs.deploy-ssh-key }}
      run: |
        mkdir -p ~/.ssh
        echo "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/deploy_key
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

    - name: Update Helm values and push
      shell: bash
      env:
        DEPLOY_REPO: ${{ inputs.deploy-repo }}
        VALUES_FILE: ${{ inputs.values-file }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        git clone "git@gitlab.com:${DEPLOY_REPO}.git" deploy-repo
        cd deploy-repo

        yq e ".image.tag = \"${IMAGE_TAG}\"" -i "${VALUES_FILE}"

        git config user.email "ci@ordomatics.com"
        git config user.name "GitHub CI"
        git add "${VALUES_FILE}"
        if git diff --cached --quiet; then
          echo "No changes — already at ${IMAGE_TAG}"
          exit 0
        fi
        git commit -m "${COMMIT_MESSAGE}"
        git push || (git pull --rebase && git push)
