name: Deploy to Helm repo
description: Pin image.tag in the client's GitLab deploy repo, in a file only CI writes.

inputs:
  deploy-repo:
    description: "GitLab path of the client's deploy repo, e.g. ordomatics/clients/acme"
    required: true
  file-suffix:
    description: >-
      Which deployment's files to touch, e.g. test / staging / prod — the same
      suffix the platform names values.<suffix>.yaml by.
    required: true
  image-tag:
    description: "Image tag to set, e.g. test-abc1234"
    required: true
  commit-message:
    description: "Git commit message"
    required: true
  deploy-ssh-key:
    description: "SSH private key for a GitLab deploy key with push access to the deploy repo"
    required: true

runs:
  using: composite
  steps:
    - name: Install yq
      shell: bash
      run: |
        sudo wget -qO /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v4.44.2/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

    - name: Set up deploy key
      shell: bash
      env:
        DEPLOY_SSH_KEY: ${{ inputs.deploy-ssh-key }}
      run: |
        mkdir -p ~/.ssh
        echo "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/deploy_key
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

    - name: Update Helm values and push
      shell: bash
      env:
        DEPLOY_REPO: ${{ inputs.deploy-repo }}
        FILE_SUFFIX: ${{ inputs.file-suffix }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        git clone "git@gitlab.com:${DEPLOY_REPO}.git" deploy-repo
        cd deploy-repo

        # Never values.<suffix>.yaml: the platform's deploy-branch primitive
        # regenerates that file whole, so a tag written there is reverted on the
        # next redeploy (live 2026-09-12). The Application lists this one last.
        IMAGE_FILE="image.${FILE_SUFFIX}.yaml"
        if [ ! -f "${IMAGE_FILE}" ]; then
          printf '# Written by the client CI on every promote. Not generated by\n# deploy-branch, so a redeploy cannot revert the running image.\nimage:\n  tag: ""\n' > "${IMAGE_FILE}"
        fi
        yq e ".image.tag = \"${IMAGE_TAG}\"" -i "${IMAGE_FILE}"

        git config user.email "ci@ordomatics.com"
        git config user.name "GitHub CI"
        git add "${IMAGE_FILE}"
        if git diff --cached --quiet; then
          echo "No changes — already at ${IMAGE_TAG}"
          exit 0
        fi
        git commit -m "${COMMIT_MESSAGE}"
        git push || (git pull --rebase && git push)
