name: Build generic base image

# Builds ordomatics/odoo:<version> from this branch (one branch per Odoo
# version — 17.0, 18.0, 19.0, etc.) and pushes to the public Docker Hub
# registry.
#
# Docker Hub, not GitLab: GitLab's container registry rejects anonymous
# pulls even for a public project — every consumer of this image would
# need a GitLab credential just to pull it, defeating the point of a
# public base image. Docker Hub supports true anonymous pulls, same as
# the official odoo:<version> image this is built FROM.

on:
  push:
    branches: [17.0]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize submodules
        run: ./scripts/setup-submodules.sh

      # Public since 2026-08-17 — no credential, so a client's fork needs no
      # GitHub token of ours at all.
      - name: Fetch infra modules
        run: |
          git clone --depth 1 https://github.com/ordomatics/infra.git addons/infra
          rm -rf addons/infra/.git

      # Public mirror of OCA/storage — provides fs_attachment_s3, a
      # dependency of one of the infra addons above.
      - name: Fetch storage modules
        run: |
          git clone --depth 1 --branch 17.0 https://github.com/ordomatics/storage.git addons/storage
          rm -rf addons/storage/.git

      # Public mirror of OCA/server-env — provides server_environment, a
      # dependency of fs_storage from the storage clone above.
      - name: Fetch server-env modules
        run: |
          git clone --depth 1 --branch 17.0 https://github.com/ordomatics/server-env.git addons/server-env
          rm -rf addons/server-env/.git

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ordomatics/odoo:17.0
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Base image published" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ordomatics/odoo:17.0\`" >> $GITHUB_STEP_SUMMARY
