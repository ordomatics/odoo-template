name: Build generic base image

# Builds ordomatics/odoo:<version> from this branch (one branch per Odoo
# version — 17.0, 18.0, 19.0, etc.) and pushes to the public GitLab
# registry. No GIT_TOKEN needed: every submodule this branch uses
# (ordomatics/ordomatics, moctarjallo/odoo-llm, moctarjallo/queue) is public.

on:
  push:
    branches: [17.0]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize submodules
        run: ./scripts/setup-submodules.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_ODOO_REGISTRY_USERNAME }}
          password: ${{ secrets.GITLAB_ODOO_REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: registry.gitlab.com/ordomatics/odoo:17.0
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Base image published" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`registry.gitlab.com/ordomatics/odoo:17.0\`" >> $GITHUB_STEP_SUMMARY
