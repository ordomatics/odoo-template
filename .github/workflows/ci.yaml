name: Build generic base image

# Builds ordomatics/odoo:<version> from this branch (one branch per Odoo
# version — 17.0, 18.0, 19.0, etc.) and pushes to the public Docker Hub
# registry.
#
# Docker Hub, not GitLab: GitLab's container registry rejects anonymous
# pulls even for a public project — every consumer of this image would
# need a GitLab credential just to pull it, defeating the point of a
# public base image. Docker Hub supports true anonymous pulls, same as
# the official odoo:<version> image this is built FROM.

on:
  push:
    branches: [18.0]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize submodules
        run: ./scripts/setup-submodules.sh

      - name: Fetch private infra modules
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/ordomatics/infra.git /tmp/infra-clone
          mkdir -p addons/infra
          cp -r /tmp/infra-clone/bus_keepalive addons/infra/
          cp -r /tmp/infra-clone/session_redis addons/infra/
          rm -rf /tmp/infra-clone

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ordomatics/odoo:18.0
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Base image published" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ordomatics/odoo:18.0\`" >> $GITHUB_STEP_SUMMARY
