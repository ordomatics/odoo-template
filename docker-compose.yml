name: client-name

# Core service only. `docker compose up` also auto-merges
# docker-compose.override.yml (db + redis) with no extra flags — that's
# enough for a working local Odoo. Add docker-compose.integrations.yml on
# top (-f) for n8n/mssql/proxy/cloudflared:
#   docker compose -f docker-compose.yml -f docker-compose.integrations.yml up
services:
  odoo:
    build:
      context: .
    env_file:
      - .env
    environment:
      - ODOO_DEV_MODE=${ODOO_DEV_MODE:-true}
      - SKIP_MODULE_SETUP=false
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons/client
      - ./logs:/var/log/odoo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  odoo-web-data:
