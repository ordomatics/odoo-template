[activate]
# Explicit module list so every module is installed AND upgraded on pod upgrades.
# Relying on transitive deps via the client module alone does not reliably
# upgrade newly added modules — list them explicitly here, with the client
# module last. Order matters for fresh installs: list dependencies before dependants.

# ── Core ──────────────────────────────────────────────────────────────────
base
web
contacts
product
account
mail

# ── OCA ───────────────────────────────────────────────────────────────────
queue_job
fastapi
endpoint_route_handler

# ── LLM suite ─────────────────────────────────────────────────────────────
llm
llm_store
llm_tool
llm_generate
llm_transcribe
llm_transcribe_job
llm_assistant
llm_mcp_server
llm_mcp_client
llm_ollama
llm_anthropic
llm_nomic
llm_fal_ai
llm_skills

# ── Storage (S3 filestore) ─────────────────────────────────────────────────
server_environment
fs_storage
fs_attachment
fs_attachment_s3

# ── Billing ───────────────────────────────────────────────────────────────
payment_wave
billing_llm
payment_llm

# ── WhatsApp ──────────────────────────────────────────────────────────────
whatsapp_base
whatsapp_messaging
whatsapp_voip
whatsapp_template
whatsapp_llm
whatsapp_payments
whatsapp_payments_llm
whatsapp_catalog
whatsapp_billing
whatsapp_billing_llm

# ── Deployment bootstrap + client (depends on all of the above) ────────────
ordomatics
client-name
