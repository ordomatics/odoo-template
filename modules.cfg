[activate]
# Explicit module list so every module is installed AND upgraded on pod upgrades.
# Relying on transitive deps via the client module alone does not reliably
# upgrade newly added modules — list them explicitly here, with your own
# module(s) last. Order matters for fresh installs: list dependencies before
# dependants.

# ── Platform base (already baked into the ordomatics/odoo image — do not
#    remove; session_redis/bus_keepalive are post_load hooks, not listed
#    here, they activate automatically) ──────────────────────────────────
base
web
crm
queue_job
llm
llm_tool
llm_thread
web_json_editor
llm_mcp_server
llm_assistant
n8n_connector
n8n_crm
llm_mssql
llm_n8n

# ── Your own addons — list your modules here, in dependency order ────────
# client-name
