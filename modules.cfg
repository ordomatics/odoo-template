[activate]
# Module list for the generic base image (ordomatics/odoo). Order matters
# for fresh installs — dependencies before dependants.
#
# session_redis / bus_keepalive are NOT listed here: they're post_load
# hooks (see their __manifest__.py), not real installable modules — they
# activate automatically just by being present on the addons path.

# ── Core ──────────────────────────────────────────────────────────────────
base
web
crm
queue_job

# ── LLM tool/assistant chain (odoo-llm, public repo) — the tool-calling +
#    assistant core, not the full LLM suite (no chat/generation modules) ──
llm
llm_tool
llm_thread
web_json_editor
llm_mcp_server
llm_assistant

# Integration modules (n8n_connector, n8n_crm, llm_mssql, llm_n8n) are
# deliberately NOT baked in here — they're opt-in. A client who wants one
# adds it themselves as their own addons/ submodule (source: the public
# ordomatics/ordomatics repo) and lists it in their own modules.cfg.
